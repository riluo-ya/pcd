<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>答题系统</title>
    <style>
        /* 样式与之前完全一致，此处省略以节省篇幅 */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border-color: #e5e7eb;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --error-red: #ef4444;
            --lock-bg: #fef2f2;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg-gradient); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; color: var(--text-main); user-select: none; -webkit-user-select: none; overflow-x: hidden; }
        .container { width: 100%; max-width: 800px; padding: 20px; padding-bottom: 120px; }
        .session-info-bar { background: white; border-radius: 10px; padding: 12px 15px; margin-bottom: 20px; box-shadow: var(--shadow-md); font-size: 0.85rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px; }
        .session-left { display: flex; align-items: center; gap: 5px; }
        .session-timer { font-weight: bold; color: var(--primary); font-size: 1rem; }
        .switch-btn { color: var(--text-sub); text-decoration: underline; cursor: pointer; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; transition: background 0.2s; }
        .switch-btn:hover { background: #f3f4f6; color: var(--primary); }
        #loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-gradient); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.3s ease; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(79, 70, 229, 0.3); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { text-align: center; color: var(--error-red); background: rgba(254, 242, 242, 0.95); padding: 20px; border-radius: 12px; box-shadow: var(--shadow-md); display: none; margin-top: 40px; }
        .locked-msg { text-align: center; background: var(--lock-bg); padding: 30px 20px; border-radius: 16px; box-shadow: var(--shadow-md); margin-top: 40px; }
        .locked-msg h2 { margin-top: 0; color: var(--error-red); font-size: 1.5rem; }
        .locked-msg p { font-size: 1rem; line-height: 1.6; color: #4b5563; margin-bottom: 10px; }
        .timer-display { font-size: 2rem; font-weight: bold; color: var(--primary); margin: 15px 0; letter-spacing: 2px; }
        .unlock-form { margin-top: 20px; background: white; padding: 15px; border-radius: 12px; box-shadow: var(--shadow-md); }
        .input-group { display: flex; gap: 8px; width: 100%; }
        .unlock-input { flex: 1; padding: 12px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; min-width: 0; }
        .unlock-btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .unlock-btn:hover { background: var(--primary-hover); }
        .unlock-error { color: var(--error-red); font-size: 0.9rem; margin-top: 8px; display: none; min-height: 1.2em; }
        .question-card { background: var(--card-bg); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,0.6); touch-action: manipulation; }
        .q-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; line-height: 1.5; display: flex; gap: 8px; }
        .q-index { color: var(--primary); font-weight: bold; }
        .options-grid { display: grid; gap: 12px; }
        .option-item { display: flex; align-items: center; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; transition: all 0.2s ease; background: white; }
        .option-item:hover { border-color: var(--primary); background: #f9fafb; }
        .option-item.selected { border-color: var(--primary); background: rgba(79, 70, 229, 0.08); box-shadow: inset 0 1px 3px rgba(79, 70, 229, 0.1); }
        .option-letter { width: 28px; height: 28px; border-radius: 50%; background: var(--border-color); color: var(--text-sub); display: flex; justify-content: center; align-items: center; font-size: 0.85rem; font-weight: bold; margin-right: 12px; flex-shrink: 0; transition: all 0.2s; }
        .option-item.selected .option-letter { background: var(--primary); color: white; }
        .option-text { font-size: 1rem; color: var(--text-main); line-height: 1.4; }
        .submit-btn-container { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 16px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 100; display: flex; justify-content: center; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 14px 60px; font-size: 1rem; font-weight: 600; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-md); min-width: 200px; }
        .submit-btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
        .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.6; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 20px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; text-align: center; max-width: 320px; width: 100%; box-shadow: var(--shadow-lg); transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
        .modal-msg { color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; white-space: pre-wrap; }
        .modal-btn { padding: 12px 32px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 500; width: 100%; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="error-display" class="container error-msg">
        <h3 style="margin-bottom: 10px;">系统异常</h3>
        <p id="error-main">无法加载页面</p>
        <button class="retry-btn" onclick="location.reload()" style="padding:8px 16px; background:#374151; color:white; border:none; border-radius:4px; cursor:pointer;">重新加载</button>
    </div>

    <div id="locked-container" class="container" style="display: none;">
        <div class="locked-msg">
            <h2>🚫 答题已冻结</h2>
            <p>您已连续答错 5 次。</p>
            <p>根据安全策略，您的设备将被暂时禁止答题。</p>
            <div class="timer-display" id="freeze-timer">10:00</div>
            <div style="margin: 20px 0; color: #6b7280; font-size: 0.9rem;">— 或者输入管理员密码跳过 —</div>
            <div class="unlock-form">
                <div class="input-group">
                    <input type="password" id="unlock-password" class="unlock-input" placeholder="请输入密码" onkeypress="if(event.key==='Enter') checkUnlock()">
                    <button class="unlock-btn" onclick="checkUnlock()">验证</button>
                </div>
                <div id="unlock-error" class="unlock-error"></div>
            </div>
        </div>
    </div>

    <div class="container" id="quiz-container" style="display: none;">
        <div id="session-info-bar" class="session-info-bar" style="display: none;">
            <div class="session-left">
                <span>当前题目将在</span>
                <span id="remaining-time" class="session-timer">--:--</span>
                <span>后自动切换</span>
            </div>
            <div class="switch-btn" onclick="showForceSwitchModal('quiz')">强制切换题目</div>
        </div>
        <div id="questions-list"></div>
    </div>

    <div class="submit-btn-container" id="submit-area" style="display: none;">
        <button id="submit-btn" class="submit-btn" disabled>提交答案</button>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">提示</div>
            <div class="modal-msg" id="modal-message"></div>
            <button id="modal-close" class="modal-btn">确定</button>
        </div>
    </div>

    <script>

    <script>
        // ================= 常量定义 =================
        const SESSION_DURATION_MS = 5 * 60 * 1000; // 5分钟
        const FREEZE_DURATION_MS = 10 * 60 * 1000;  // 10分钟
        const MAX_FAILURES = 5;
        const TARGET_MD5 = MD5('riluoya');
        const SESSION_INFO_KEY = 'current_session_info'; // 用于存储当前会话的种子和开始时间
        const TOKEN_VALID_MS = 60 * 60 * 1000; // 1小时

        let sessionTimerInterval = null;
        let sessionStartTime = 0;
        let currentSessionSeed = '';

        // ================= 安全防护 =================
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            ['copy', 'cut', 'paste', 'selectstart'].forEach(evt => {
                document.addEventListener(evt, e => { e.preventDefault(); return false; });
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === 'u')) {
                    e.preventDefault();
                }
            });
        })();

        // ================= Token 检查与跳转 =================
        function checkTokenAndRedirect() {
            const token = localStorage.getItem('access_token');
            if (!token) return false;
            try {
                const decoded = atob(token);
                const parts = decoded.split('|');
                if (parts.length < 3) return false;
                const ts = parseInt(parts[0], 10);
                if (isNaN(ts)) return false;
                const now = Date.now();
                if (now - ts < TOKEN_VALID_MS) {
                    // 有效，显示提示并跳转
                    showModal('提示', '您已通过验证，权限有效，即将跳转...', 2000, () => {
                        window.location.href = './home.html';
                    });
                    return true;
                } else {
                    // 过期，清除token
                    localStorage.removeItem('access_token');
                    return false;
                }
            } catch (e) {
                return false;
            }
        }

        // ================= 业务逻辑 =================
        let questionsData = [];
        let currentQuestions = [];
        let userAnswers = {};
        let isSubmitting = false;
        let freezeTimerInterval = null;
        let isPerformingAutoSwitch = false; // 防止自动切换重复触发

        document.addEventListener('DOMContentLoaded', () => {
            // 先检查Token是否有效，有效则跳转
            if (checkTokenAndRedirect()) {
                return; // 已处理跳转
            }
            // 否则正常进入答题流程
            checkFreezeStatus();
        });

        function checkFreezeStatus() {
            const lastFailedTime = localStorage.getItem('last_failed_time');
            if (lastFailedTime) {
                const now = Date.now();
                const elapsed = now - parseInt(lastFailedTime);
                if (elapsed < FREEZE_DURATION_MS) {
                    startFreezeUI(FREEZE_DURATION_MS - elapsed);
                    return;
                } else {
                    clearFreezeState();
                }
            }
            initQuiz();
        }

        function clearFreezeState() {
            localStorage.removeItem('last_failed_time');
            localStorage.removeItem('failed_count');
        }

        function startFreezeUI(remainingMs) {
            showLoading(false);
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('submit-area').style.display = 'none';
            document.getElementById('locked-container').style.display = 'block';

            const timerEl = document.getElementById('freeze-timer');
            freezeTimerInterval = setInterval(() => {
                remainingMs -= 1000;
                if (remainingMs <= 0) {
                    clearInterval(freezeTimerInterval);
                    clearFreezeState();
                    location.reload();
                } else {
                    const mins = Math.floor(remainingMs / 60000);
                    const secs = Math.floor((remainingMs % 60000) / 1000);
                    timerEl.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                }
            }, 1000);
            
            const mins = Math.floor(remainingMs / 60000);
            const secs = Math.floor((remainingMs % 60000) / 1000);
            timerEl.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        window.checkUnlock = function() {
            const input = document.getElementById('unlock-password');
            const errorMsg = document.getElementById('unlock-error');
            const userPwd = input.value.trim();
            if (!userPwd) {
                errorMsg.innerText = "请输入密码";
                errorMsg.style.display = 'block';
                return;
            }
            if (MD5(userPwd) === TARGET_MD5) {
                errorMsg.style.display = 'none';
                input.value = '';
                clearFreezeState();
                document.getElementById('locked-container').style.display = 'none';
                showLoading(true);
                setTimeout(initQuiz, 100);
            } else {
                errorMsg.innerText = "密码错误，请重试";
                errorMsg.style.display = 'block';
                input.value = '';
                input.focus();
            }
        };

        // 获取或创建当前会话信息
        function getOrCreateSessionInfo() {
            // 尝试从 localStorage 读取持久化的会话信息
            const stored = localStorage.getItem(SESSION_INFO_KEY);
            if (stored) {
                try {
                    const info = JSON.parse(stored);
                    const elapsed = Date.now() - info.startTime;
                    // 检查会话是否仍然有效（未超过5分钟）
                    if (elapsed < SESSION_DURATION_MS) {
                        return {
                            seed: info.seed,
                            startTime: info.startTime
                        };
                    }
                } catch (e) {}
            }
            // 如果没有有效会话，生成全新的（基于时间戳保证唯一）
            const newSeed = 'sess_' + Date.now();
            const newStartTime = Date.now();
            // 存储新会话
            localStorage.setItem(SESSION_INFO_KEY, JSON.stringify({
                seed: newSeed,
                startTime: newStartTime
            }));
            return {
                seed: newSeed,
                startTime: newStartTime
            };
        }

        // 强制刷新会话（用于密码换题和自动到期换题）
        function forceNewSession() {
            if (!questionsData || questionsData.length === 0) {
                showLoading(false);
                showModal('换题失败', '题库数据尚未加载，请刷新页面后重试。');
                return;
            }

            // 生成全新会话信息
            const newSeed = 'sess_' + Date.now();
            const newStartTime = Date.now();
            localStorage.setItem(SESSION_INFO_KEY, JSON.stringify({
                seed: newSeed,
                startTime: newStartTime
            }));

            // 更新全局变量
            currentSessionSeed = newSeed;
            sessionStartTime = newStartTime;

            // 生成新题目
            const newConfig = generateQuestionConfig(questionsData);
            currentQuestions = newConfig.questions.map(q => ({ ...q, renderedOptions: q.renderedOptions }));
            userAnswers = {};

            // 缓存新题目
            try {
                localStorage.setItem(newSeed, JSON.stringify(newConfig));
            } catch (e) {}

            // 重新渲染界面
            renderQuestions();
            isSubmitting = false;
            const btn = document.getElementById('submit-btn');
            if (btn) {
                btn.innerText = "提交答案";
                btn.disabled = true;
            }

            // 确保所有UI正确显示
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('submit-area').style.display = 'flex';
            document.getElementById('session-info-bar').style.display = 'flex';
            document.getElementById('locked-container').style.display = 'none';
            document.getElementById('error-display').style.display = 'none';

            // 重启倒计时
            if (sessionTimerInterval) clearInterval(sessionTimerInterval);
            updateSessionTimer();
            sessionTimerInterval = setInterval(updateSessionTimer, 1000);

            showLoading(false);
            checkSubmissionAvailability();
            console.log('会话已刷新，新种子:', newSeed);
        }

        async function initQuiz() {
            try {
                const response = await fetch('./timu.json?t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP 错误: ${response.status} ${response.statusText}`);
                const text = await response.text();
                try {
                    questionsData = JSON.parse(text);
                } catch (parseErr) {
                    throw new Error("JSON 格式解析失败: " + parseErr.message);
                }
                if (!Array.isArray(questionsData)) {
                    throw new Error("题库数据格式错误: 期望是一个数组");
                }
                loadAndRender();
            } catch (error) {
                console.error(error);
                showLoading(false);
                showError('加载失败', error.message);
            }
        }

        function loadAndRender() {
            // 获取当前有效的会话信息（优先使用存储的会话）
            const sessionInfo = getOrCreateSessionInfo();
            currentSessionSeed = sessionInfo.seed;
            sessionStartTime = sessionInfo.startTime;

            // 尝试加载该种子对应的题目缓存
            let cachedConfig = null;
            try {
                const cachedStr = localStorage.getItem(sessionInfo.seed);
                if (cachedStr) {
                    cachedConfig = JSON.parse(cachedStr);
                }
            } catch (e) {}

            let config;
            if (cachedConfig) {
                config = cachedConfig;
            } else {
                config = generateQuestionConfig(questionsData);
                try {
                    localStorage.setItem(sessionInfo.seed, JSON.stringify(config));
                } catch (e) {}
            }

            currentQuestions = config.questions.map(q => ({ ...q, renderedOptions: q.renderedOptions }));
            renderQuestions();

            document.getElementById('session-info-bar').style.display = 'flex';
            if (sessionTimerInterval) clearInterval(sessionTimerInterval);
            updateSessionTimer();
            sessionTimerInterval = setInterval(updateSessionTimer, 1000);

            setTimeout(() => {
                showLoading(false);
                document.getElementById('quiz-container').style.display = 'block';
                document.getElementById('submit-area').style.display = 'flex';
                document.getElementById('locked-container').style.display = 'none';
                checkSubmissionAvailability();
            }, 100);
        }

        function updateSessionTimer() {
            const now = Date.now();
            const remaining = sessionStartTime + SESSION_DURATION_MS - now;
            const el = document.getElementById('remaining-time');

            if (el) {
                if (remaining <= 0) {
                    // 倒计时结束，自动切换题目
                    if (!isPerformingAutoSwitch) {
                        isPerformingAutoSwitch = true;
                        // 防止定时器多次触发
                        if (sessionTimerInterval) clearInterval(sessionTimerInterval);
                        el.innerText = "正在切换...";
                        el.style.color = "#6b7280";
                        // 短暂延迟后执行换题
                        setTimeout(() => {
                            forceNewSession();
                            isPerformingAutoSwitch = false;
                        }, 500);
                    }
                } else {
                    const mins = Math.floor(remaining / 60000);
                    const secs = Math.floor((remaining % 60000) / 1000);
                    el.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                    el.style.color = "var(--primary)";
                }
            }
        }

        function generateQuestionConfig(allQuestions) {
            let pool = JSON.parse(JSON.stringify(allQuestions));
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            const limit = Math.min(5, pool.length);
            const selected = pool.slice(0, limit);
            selected.forEach(q => {
                for (let i = q.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                }
                q.renderedOptions = q.options;
            });
            return { questions: selected };
        }

        function renderQuestions() {
            const listContainer = document.getElementById('questions-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            userAnswers = {};

            currentQuestions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                const titleHtml = `<div class="q-title"><span class="q-index">${String.fromCharCode(65 + index)}.</span> ${escapeHtml(q.title)}</div>`;
                let optionsHtml = '<div class="options-grid">';
                q.renderedOptions.forEach((opt, optIndex) => {
                    const letter = String.fromCharCode(65 + optIndex);
                    optionsHtml += `
                        <div class="option-item" data-idx="${optIndex}" data-qidx="${index}" onclick="handleOptionClick(this)">
                            <div class="option-letter">${letter}</div>
                            <div class="option-text">${escapeHtml(opt.text)}</div>
                        </div>
                    `;
                });
                optionsHtml += '</div>';
                card.innerHTML = titleHtml + optionsHtml;
                listContainer.appendChild(card);
            });
        }

        window.handleOptionClick = function(element) {
            if (isSubmitting) return;
            const card = element.closest('.question-card');
            card.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            const qIdx = parseInt(element.dataset.qidx, 10);
            const optIdx = parseInt(element.dataset.idx, 10);
            userAnswers[qIdx] = optIdx;
            checkSubmissionAvailability();
        };

        function checkSubmissionAvailability() {
            const submitBtn = document.getElementById('submit-btn');
            if (!submitBtn) return;
            const allAnswered = currentQuestions.every((_, idx) => userAnswers.hasOwnProperty(idx));
            submitBtn.disabled = !allAnswered;
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            if (isSubmitting) return;
            isSubmitting = true;
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "正在判卷...";

            try {
                let allCorrect = true;
                currentQuestions.forEach((q, qIndex) => {
                    const selectedIndex = userAnswers[qIndex];
                    if (selectedIndex === undefined) {
                        allCorrect = false;
                        return;
                    }
                    const selectedText = q.renderedOptions[selectedIndex].text.trim().toLowerCase();
                    const correctText = q.answerText.trim().toLowerCase();
                    if (selectedText !== correctText) {
                        allCorrect = false;
                    }
                });

                if (allCorrect) {
                    clearFreezeState();
                    await generateAndSaveToken();
                    showModal('恭喜！', '答题正确，即将跳转...', 1500, () => {
                        location.href = './home.html';
                    });
                } else {
                    incrementFailureCount();
                    showModal('提示', '答题有误，请重新作答！', null, () => {
                        isSubmitting = false;
                        btn.innerText = "提交答案";
                        checkSubmissionAvailability();
                    });
                }
            } catch (error) {
                console.error(error);
                showModal('判卷异常', '系统错误详情:\n' + error.message, null, () => {
                    isSubmitting = false;
                    btn.innerText = "提交答案";
                    checkSubmissionAvailability();
                });
            }
        });

        function incrementFailureCount() {
            let count = parseInt(localStorage.getItem('failed_count') || '0', 10);
            count++;
            localStorage.setItem('failed_count', count.toString());
            if (count >= MAX_FAILURES) {
                localStorage.setItem('last_failed_time', Date.now().toString());
                clearInterval(freezeTimerInterval);
                location.reload();
            }
        }

        async function generateAndSaveToken() {
            const payload = {
                ts: Date.now(),
                uid: 'usr_' + Math.random().toString(36).substr(2, 9)
            };
            const signString = `${payload.ts}|${payload.uid}`;
            const signature = simpleHash(signString);
            const token = btoa(signString + '|' + signature);
            localStorage.setItem('access_token', token);
        }

        function simpleHash(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
            }
            return (hash >>> 0).toString(16);
        }

        function showLoading(show) {
            const overlay = document.getElementById('loading-overlay');
            if (!overlay) return;
            if (show) {
                overlay.style.display = 'flex';
                overlay.style.opacity = '1';
                overlay.style.visibility = 'visible';
            } else {
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
                setTimeout(() => {
                    if (overlay.style.visibility === 'hidden') {
                        overlay.style.display = 'none';
                    }
                }, 300);
            }
        }

        function showError(mainMsg, detailMsg) {
            document.getElementById('error-main').innerText = mainMsg;
            document.getElementById('error-display').style.display = 'block';
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('submit-area').style.display = 'none';
            document.getElementById('session-info-bar').style.display = 'none';
        }

        function showModal(title, message, timeoutMs, callback) {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            modal.classList.add('active');
            const closeBtn = document.getElementById('modal-close');
            const newCloseBtn = closeBtn.cloneNode(true);
            closeBtn.parentNode.replaceChild(newCloseBtn, closeBtn);
            newCloseBtn.onclick = () => {
                modal.classList.remove('active');
                if (callback) callback();
            };
            if (timeoutMs) {
                setTimeout(() => {
                    modal.classList.remove('active');
                    if (callback) callback();
                }, timeoutMs);
            }
        }

        function escapeHtml(text) {
            if (!text) return text;
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // ================= 强制切换题目模态框相关 =================
        window.showForceSwitchModal = function(context) {
            const modal = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-message');
            const btn = document.getElementById('modal-close');

            title.innerText = "强制切换题目";
            msg.innerHTML = `
                <div style="margin-bottom:10px;">请输入管理员密码以强制切换新题目：</div>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="password" id="force-switch-pwd" class="unlock-input" placeholder="密码" style="flex:1;" onkeypress="if(event.key==='Enter') verifyAndSwitch()">
                    <button class="unlock-btn" onclick="verifyAndSwitch()">验证</button>
                </div>
                <div id="force-switch-error" class="unlock-error"></div>
            `;

            modal.classList.add('active');

            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.onclick = () => {
                modal.classList.remove('active');
            };

            setTimeout(() => {
                const pwdInput = document.getElementById('force-switch-pwd');
                if (pwdInput) pwdInput.focus();
            }, 100);
        };

        window.verifyAndSwitch = function() {
            const input = document.getElementById('force-switch-pwd');
            const errorMsg = document.getElementById('force-switch-error');
            if (!input) return;

            const pwd = input.value.trim();
            if (!pwd) {
                errorMsg.innerText = "请输入密码";
                errorMsg.style.display = 'block';
                return;
            }
            if (MD5(pwd) !== TARGET_MD5) {
                errorMsg.innerText = "密码错误";
                errorMsg.style.display = 'block';
                input.value = '';
                return;
            }

            errorMsg.style.display = 'none';
            input.value = '';
            document.getElementById('modal-overlay').classList.remove('active');
            showLoading(true);
            setTimeout(() => {
                forceNewSession();
            }, 150);
        };
    </script>
</body>
</html>
