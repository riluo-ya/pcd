<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phigros Chart Studio | 谱面工坊</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-0: #07070a;
            --bg-1: #0f0f18;
            --bg-2: #161622;
            --bg-3: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text: #eaeaf0;
            --text-2: #8a8aa0;
            --accent: #7c6cf0;
            --accent-2: #a78bfa;
            --tap: #60c8ff;
            --drag: #ffe066;
            --flick: #ff6b6b;
            --hold: #5eead4;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 14px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-0); color: var(--text); overflow-x: hidden; }
        .ambient { position:fixed; inset:0; z-index:-1; pointer-events:none; background: radial-gradient(1200px 600px at 10% -10%, rgba(124,108,240,0.12), transparent), radial-gradient(800px 400px at 90% 110%, rgba(94,234,212,0.08), transparent); }
        .wrap { max-width:1100px; margin:0 auto; padding:32px 20px 60px; }
        .brand { text-align:center; margin-bottom:32px; animation: fadeDown .7s ease both; }
        .brand h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight:800; letter-spacing:-0.5px; background: linear-gradient(135deg, #a78bfa, #60c8ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .brand p { color:var(--text-2); font-size:.95rem; margin-top:6px; }

        #loading-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(7,7,10,0.92); backdrop-filter: blur(16px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.3s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(124,108,240,0.3);
            border-top: 4px solid var(--accent);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(7,7,10,0.85); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; visibility: hidden;
            transition: all 0.3s ease; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-1); padding: 30px; border-radius: var(--radius);
            text-align: center; max-width: 360px; width: 100%;
            border: 1px solid var(--border); box-shadow: var(--shadow);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; color: var(--flick); }
        .modal-msg { color: var(--text-2); margin-bottom: 24px; line-height: 1.5; white-space: pre-wrap; font-size: 0.95rem; }
        .modal-btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
        .btn-primary { padding: 10px 24px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(124,108,240,0.3); }
        .btn-secondary { padding: 10px 24px; background: var(--bg-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.9rem; transition: 0.2s; }
        .btn-secondary:hover { border-color: var(--border-hover); background: var(--bg-3); }
        .error-details { background: var(--bg-2); padding: 12px; border-radius: 8px; margin: 15px 0 0 0; font-size: 0.85rem; color: var(--text-2); text-align: left; word-break: break-all; display: none; }

        .uploader {
            position:relative; border:2px dashed var(--border); border-radius:var(--radius); padding:48px 24px;
            text-align:center; background:var(--bg-3); transition:.3s ease; cursor:pointer; overflow:hidden;
            animation: fadeUp .7s .1s ease both; user-select:none;
        }
        .uploader:hover, .uploader.drag-active { border-color:var(--accent); background:rgba(124,108,240,0.06); transform:translateY(-2px); }
        .uploader input[type="file"] { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; z-index:2; font-size:100px; }
        .uploader-icon { font-size:2.6rem; margin-bottom:10px; opacity:.9; pointer-events:none; }
        .uploader h3 { font-size:1.1rem; font-weight:600; pointer-events:none; }
        .uploader span { color:var(--text-2); font-size:.85rem; display:block; margin-top:6px; pointer-events:none; }
        .file-chip {
            display:none; align-items:center; justify-content:center; gap:8px; margin-top:14px;
            padding:8px 18px; background:rgba(94,234,212,0.08); border:1px solid rgba(94,234,212,0.2);
            color:var(--hold); border-radius:100px; font-size:.85rem; font-weight:600; width:fit-content;
            margin-left:auto; margin-right:auto; pointer-events:none;
        }
        .file-chip.show { display:inline-flex; }
        .workspace { display:none; margin-top:24px; gap:20px; flex-direction:column; animation: fadeUp .6s ease both; }
        .workspace.active { display:flex; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        @media (max-width:780px) { .row { grid-template-columns:1fr; } }
        .card { background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); transition:.3s ease; }
        .card:hover { border-color:var(--border-hover); }
        .card-head { display:flex; align-items:center; gap:10px; margin-bottom:18px; font-weight:700; font-size:1.05rem; }
        .card-head .dot { width:10px; height:10px; border-radius:50%; box-shadow:0 0 8px currentColor; }
        .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .stat-cell {
            position:relative; background:var(--bg-0); border:1px solid var(--border); border-radius:12px;
            padding:16px 12px; text-align:center; transition:.25s ease;
        }
        .stat-cell:hover { transform:translateY(-2px); border-color:var(--border-hover); }
        .stat-cell::after { content:''; position:absolute; bottom:0; left:10%; right:10%; height:3px; border-radius:3px 3px 0 0; opacity:.7; }
        .stat-cell.tap::after { background:var(--tap); box-shadow:0 0 8px var(--tap); }
        .stat-cell.drag::after { background:var(--drag); box-shadow:0 0 8px var(--drag); }
        .stat-cell.flick::after { background:var(--flick); box-shadow:0 0 8px var(--flick); }
        .stat-cell.hold::after { background:var(--hold); box-shadow:0 0 8px var(--hold); }
        .stat-num { font-size:1.8rem; font-weight:800; line-height:1; margin-bottom:6px; }
        .stat-cell.tap .stat-num { color:var(--tap); }
        .stat-cell.drag .stat-num { color:var(--drag); }
        .stat-cell.flick .stat-num { color:var(--flick); }
        .stat-cell.hold .stat-num { color:var(--hold); }
        .stat-label { font-size:.8rem; color:var(--text-2); }
        .stat-pct { font-size:.75rem; opacity:.7; margin-top:2px; font-weight:600; }
        .total-pill {
            margin-top:16px; padding:18px; border-radius:12px; text-align:center;
            background:linear-gradient(135deg, rgba(124,108,240,0.12), rgba(167,139,250,0.08)); border:1px solid rgba(124,108,240,0.2);
        }
        .total-pill .n { font-size:2.2rem; font-weight:900; background:linear-gradient(135deg, #a78bfa, #60c8ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .total-pill .l { font-size:.85rem; color:var(--text-2); margin-top:2px; }
        .dist-track { margin-top:14px; height:6px; background:var(--bg-0); border-radius:100px; overflow:hidden; display:flex; }
        .dist-fill { height:100%; transition:width .8s cubic-bezier(.22,1,.36,1); }
        .mini-canvas-wrap { margin-top:14px; height:130px; background:var(--bg-0); border-radius:10px; overflow:hidden; position:relative; cursor:pointer; }
        .mini-canvas-wrap canvas { width:100%; height:100%; display:block; }
        .mini-canvas-wrap .cap { position:absolute; top:8px; left:10px; font-size:.7rem; color:var(--text-2); background:rgba(0,0,0,.4); padding:2px 8px; border-radius:4px; pointer-events:none; }
        .dynamic-rules { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
        .rule-row { display:flex; align-items:center; gap:8px; background:var(--bg-0); padding:10px 12px; border-radius:10px; }
        .rule-row select { background:var(--bg-2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:.85rem; outline:none; cursor:pointer; flex:1; }
        .rule-row select option { background:var(--bg-2); }
        .rule-row .arrow { color:var(--text-2); font-weight:700; }
        .rule-row .del-btn { background:none; border:1px solid var(--border); color:var(--flick); width:32px; height:32px; border-radius:6px; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition:.2s; }
        .rule-row .del-btn:hover { background:rgba(255,107,107,0.15); border-color:var(--flick); }
        .add-rule-btn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:12px; background:var(--bg-3); border:1px dashed var(--border); color:var(--accent); border-radius:10px; cursor:pointer; font-weight:700; transition:.2s; }
        .add-rule-btn:hover { border-color:var(--accent); background:rgba(124,108,240,0.05); }
        .field { margin-top:14px; padding:12px 14px; background:var(--bg-0); border-radius:10px; display:flex; align-items:center; gap:10px; }
        .field label { font-size:.9rem; flex-shrink:0; color:var(--text-2); }
        .field select { flex:1; background:transparent; color:var(--text); border:none; outline:none; font-size:.9rem; cursor:pointer; }
        .field select option { background:var(--bg-2); color:var(--text); }
        .shield { margin-top:12px; padding:14px; border-radius:10px; display:flex; align-items:center; gap:12px; background:rgba(255,107,107,.06); border:1px solid rgba(255,107,107,.15); cursor:pointer; transition:.2s; user-select:none; }
        .shield:hover { background:rgba(255,107,107,.1); border-color:rgba(255,107,107,.25); }
        .shield input { width:20px; height:20px; accent-color:var(--flick); flex-shrink:0; cursor:pointer; }
        .shield .t { font-weight:700; font-size:.9rem; color:var(--flick); }
        .shield .d { font-size:.8rem; color:var(--text-2); margin-top:2px; }
        .feat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .feat-btn {
            padding:14px 10px; background:var(--bg-0); border:1px solid var(--border); border-radius:10px;
            color:var(--text); font-size:.88rem; cursor:pointer; transition:.2s;
            display:flex; flex-direction:column; align-items:center; gap:6px; user-select:none;
        }
        .feat-btn:hover { border-color:var(--border-hover); background:rgba(255,255,255,.03); transform:translateY(-1px); }
        .feat-btn.active { border-color:var(--accent); background:rgba(124,108,240,.1); box-shadow:0 0 20px rgba(124,108,240,.15); }
        .feat-btn .em { font-size:1.4rem; line-height:1; }
        .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:4px; }
        .btn { flex:1; min-width:160px; padding:14px 20px; border-radius:12px; border:none; font-size:.95rem; font-weight:700; cursor:pointer; transition:.25s; display:inline-flex; align-items:center; justify-content:center; gap:8px; user-select:none; }
        .btn-prim { background:linear-gradient(135deg, #7c6cf0, #a78bfa); color:#fff; box-shadow:0 10px 30px rgba(124,108,240,.35); }
        .btn-prim:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 14px 40px rgba(124,108,240,.45); }
        .btn-prim:disabled { opacity:.5; cursor:not-allowed; }
        .btn-sec { background:var(--bg-2); color:var(--text); border:1px solid var(--border); }
        .btn-sec:hover { border-color:var(--border-hover); background:var(--bg-3); }
        .overlay {
            position:fixed; inset:0; z-index:100; background:rgba(7,7,10,.85); backdrop-filter:blur(12px);
            display:none; align-items:center; justify-content:center; opacity:0; transition:opacity .3s ease;
        }
        .overlay.on { display:flex; opacity:1; }
        .modal {
            width:min(90%,420px); background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius);
            padding:36px 28px; text-align:center; box-shadow:var(--shadow); transform:scale(.96); transition:transform .3s ease;
        }
        .overlay.on .modal { transform:scale(1); }
        .modal .pct { font-size:2.6rem; font-weight:900; background:linear-gradient(135deg, #a78bfa, #60c8ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; margin-bottom:6px; }
        .modal .status { color:var(--text-2); font-size:.95rem; margin-bottom:24px; }
        .track { height:8px; background:var(--bg-0); border-radius:100px; overflow:hidden; margin-bottom:10px; }
        .bar { height:100%; width:0%; border-radius:100px; background:linear-gradient(90deg, #7c6cf0, #60c8ff); transition:width .25s ease; position:relative; overflow:hidden; }
        .bar::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); animation:shimmer 1.4s infinite; }
        .modal .detail { font-size:.85rem; color:var(--text-2); margin-top:4px; }
        .canvas-overlay {
            position:fixed; inset:0; z-index:150; background:rgba(7,7,10,0.95); backdrop-filter:blur(20px);
            display:none; align-items:center; justify-content:center; flex-direction:column;
        }
        .canvas-overlay.on { display:flex; }
        .canvas-overlay .close-btn {
            position:absolute; top:24px; right:24px; background:var(--bg-1); border:1px solid var(--border);
            color:var(--text); width:48px; height:48px; border-radius:50%; cursor:pointer; font-size:1.5rem;
            display:flex; align-items:center; justify-content:center; transition:.2s; z-index:10;
        }
        .canvas-overlay .close-btn:hover { background:var(--bg-2); border-color:var(--border-hover); }
        .canvas-overlay canvas { width:95%; height:80%; border-radius:12px; background:var(--bg-0); }
        .toast {
            position:fixed; bottom:24px; right:24px; z-index:200; background:var(--bg-1); border:1px solid var(--border);
            border-radius:12px; padding:14px 18px; box-shadow:var(--shadow); display:none; align-items:center;
            gap:12px; max-width:360px; animation:slideIn .35s ease both;
        }
        .toast.on { display:flex; }
        .toast .icon { font-size:1.3rem; flex-shrink:0; }
        .toast .body { flex:1; }
        .toast .title { font-weight:700; font-size:.92rem; }
        .toast .msg { font-size:.85rem; color:var(--text-2); margin-top:1px; }

        /* 禁用样式 */
        select:disabled, button:disabled { opacity: 0.4; cursor: not-allowed; }
        .add-rule-btn:disabled { opacity: 0.4; pointer-events: none; }

        @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        @keyframes shimmer { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
        @keyframes slideIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
    </style>
</head>
<body>
    <div id="loading-overlay"><div class="spinner"></div></div>

    <div id="error-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="error-title">访问受限</div>
            <div class="modal-msg" id="error-message"></div>
            <div id="error-details" class="error-details"></div>
            <div class="modal-btn-group">
                <button id="back-btn" class="btn-secondary">返回答题页</button>
                <button id="reload-btn" class="btn-primary">刷新重试</button>
            </div>
        </div>
    </div>

    <div class="ambient"></div>
    <div class="wrap" id="main-content" style="display: none;">
        <header class="brand">
            <h1>Phigros Chart Studio</h1>
            <p>谱面统计 · 动态替换 · ZIP 难度自动更新</p>
        </header>

        <div class="uploader" id="dropZone">
            <input type="file" id="fileInput" accept=".json,.zip,application/json,application/zip">
            <div class="uploader-icon">📂</div>
            <h3>点击或拖拽上传谱面 JSON / ZIP</h3>
            <span>支持 Phigros formatVersion 2 / 3 · ZIP 自动识别 JSON 与 info.txt</span>
            <div class="file-chip" id="fileChip">
                <span>✓</span>
                <span id="fileChipText">未选择文件</span>
            </div>
        </div>

        <div id="emptyBox">
            <div class="card" style="margin-top:20px">
                <div class="empty"><span class="em">🎼</span><div>请先上传谱面文件以开始处理</div></div>
            </div>
        </div>

        <div class="workspace" id="workspace">
            <div class="row">
                <div class="card">
                    <div class="card-head"><div class="dot" style="background:var(--accent);color:var(--accent)"></div>谱面统计</div>
                    <div class="stat-grid">
                        <div class="stat-cell tap"><div class="stat-num" id="sTap">0</div><div class="stat-label">Tap 蓝键</div><div class="stat-pct" id="pTap">0%</div></div>
                        <div class="stat-cell drag"><div class="stat-num" id="sDrag">0</div><div class="stat-label">Drag 黄键</div><div class="stat-pct" id="pDrag">0%</div></div>
                        <div class="stat-cell flick"><div class="stat-num" id="sFlick">0</div><div class="stat-label">Flick 红键</div><div class="stat-pct" id="pFlick">0%</div></div>
                        <div class="stat-cell hold"><div class="stat-num" id="sHold">0</div><div class="stat-label">Hold 长条</div><div class="stat-pct" id="pHold">0%</div></div>
                    </div>
                    <div class="total-pill"><div class="n" id="sTotal">0</div><div class="l">总物量</div></div>
                    <div class="dist-track" id="distTrack">
                        <div class="dist-fill" id="dTap" style="width:0%;background:var(--tap)"></div>
                        <div class="dist-fill" id="dDrag" style="width:0%;background:var(--drag)"></div>
                        <div class="dist-fill" id="dFlick" style="width:0%;background:var(--flick)"></div>
                        <div class="dist-fill" id="dHold" style="width:0%;background:var(--hold)"></div>
                    </div>
                    <div class="mini-canvas-wrap" id="miniCanvasWrap"><canvas id="timeCanvas"></canvas><div class="cap">节拍分布预览 (点击放大)</div></div>
                </div>
                <div class="card">
                    <div class="card-head"><div class="dot" style="background:var(--flick);color:var(--flick)"></div>替换规则</div>
                    <div class="dynamic-rules" id="dynamicRules"></div>
                    <button class="add-rule-btn" id="addRuleBtn">＋ 添加替换规则</button>
                    <div class="field"><label>全局统一：</label><select id="globalSel">
                        <option value="0">不统一</option>
                        <option value="1">全部转为 Tap</option>
                        <option value="2">全部转为 Drag</option>
                        <option value="4">全部转为 Flick</option>
                        <option value="3">全部转为 Hold</option>
                    </select></div>
                    <label class="shield">
                        <input type="checkbox" id="shieldHold">
                        <div>
                            <div class="t">🛡️ 屏蔽长条 (Hold)</div>
                            <div class="d">常规替换时保留 Hold 不变</div>
                        </div>
                    </label>
                </div>
            </div>
            <div class="row">
                <div class="card">
                    <div class="card-head"><div class="dot" style="background:var(--hold);color:var(--hold)"></div>高级功能</div>
                    <div class="feat-grid">
                        <button class="feat-btn" data-feat="random"><span class="em">🎲</span><span>随机</span></button>
                    </div>
                    <div id="randomShieldWrap" style="display:none; margin-top:12px;">
                        <label class="shield">
                            <input type="checkbox" id="randomShieldHold">
                            <div>
                                <div class="t">🛡️ 随机屏蔽长条 (Hold)</div>
                                <div class="d">随机替换时保留 Hold 不变</div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-prim" id="processBtn">▶ 处理并下载</button>
                <button class="btn btn-sec" id="resetBtn">↺ 重置规则</button>
                <button class="btn btn-sec" id="reportBtn">📄 导出报告</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="pct" id="progPct">0%</div>
            <div class="status" id="progStatus">准备处理…</div>
            <div class="track"><div class="bar" id="progBar"></div></div>
            <div class="detail" id="progDetail">初始化中</div>
        </div>
    </div>

    <div class="canvas-overlay" id="canvasOverlay">
        <button class="close-btn" id="closeCanvasBtn">✕</button>
        <canvas id="largeTimeCanvas"></canvas>
    </div>

    <div class="toast" id="toast">
        <div class="icon" id="toastIcon">✅</div>
        <div class="body"><div class="title" id="toastTitle">提示</div><div class="msg" id="toastMsg">操作成功</div></div>
    </div>

    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            ['copy', 'cut', 'paste', 'selectstart'].forEach(evt => {
                document.addEventListener(evt, e => { e.preventDefault(); return false; });
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === 'u')) {
                    e.preventDefault();
                }
            });
        })();

        function simpleHash(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
            }
            return (hash >>> 0).toString(16);
        }

        async function verifyAccess() {
            const token = localStorage.getItem('access_token');
            if (!token) throw new Error('无凭证信息');
            let parts;
            try {
                const payloadStr = atob(token);
                parts = payloadStr.split('|');
            } catch (e) { throw new Error('凭证格式损坏'); }
            if (parts.length !== 3) throw new Error('凭证结构错误');
            const timestamp = parseInt(parts[0], 10);
            const uid = parts[1];
            const providedSig = parts[2];
            const now = Date.now();
            const expirationTime = timestamp + (60 * 60 * 1000);
            if (now > expirationTime) {
                localStorage.removeItem('access_token');
                throw new Error('凭证已过期 (超过1小时)');
            }
            const signString = `${timestamp}|${uid}`;
            const expectedSig = simpleHash(signString);
            if (providedSig !== expectedSig) throw new Error('签名校验失败 (凭证可能被篡改)');
            return true;
        }

        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';
            setTimeout(() => { if (overlay.style.visibility === 'hidden') overlay.style.display = 'none'; }, 300);
        }

        function showAuthError(msg) {
            document.getElementById('error-title').innerText = '访问受限';
            document.getElementById('error-message').innerText = msg;
            document.getElementById('error-details').innerText = '请先完成答题验证后再访问此页面。';
            document.getElementById('error-details').style.display = 'block';
            document.getElementById('error-modal').classList.add('active');
            document.getElementById('main-content').style.display = 'none';
            hideLoading();
        }

        (async function init() {
            try { await verifyAccess(); }
            catch (err) { showAuthError(err.message); return; }
            document.getElementById('main-content').style.display = 'block';
            hideLoading();

            (function() {
                'use strict';
                const typeNames = { 1: 'Tap', 2: 'Drag', 3: 'Hold', 4: 'Flick' };
                const typeOptions = [
                    { value: 1, label: '蓝键 (Tap)' },
                    { value: 2, label: '黄键 (Drag)' },
                    { value: 4, label: '红键 (Flick)' },
                    { value: 3, label: '长条 (Hold)' }
                ];
                let chartData = null, fileName = 'chart.json', statsCache = null;
                let zipImportData = null, zipJsonPath = null, isZipImport = false;

                const $ = s => document.querySelector(s);
                const $$ = s => Array.from(document.querySelectorAll(s));

                const dropZone = $('#dropZone'), fileInput = $('#fileInput'), fileChip = $('#fileChip'), fileChipText = $('#fileChipText');
                const emptyBox = $('#emptyBox'), workspace = $('#workspace');
                const processBtn = $('#processBtn'), resetBtn = $('#resetBtn'), reportBtn = $('#reportBtn');
                const globalSel = $('#globalSel');
                const shieldHold = $('#shieldHold');
                const overlay = $('#overlay'), progPct = $('#progPct'), progStatus = $('#progStatus'), progBar = $('#progBar'), progDetail = $('#progDetail');
                const toast = $('#toast');
                const dynamicRules = $('#dynamicRules');
                const addRuleBtn = $('#addRuleBtn');
                const miniCanvasWrap = $('#miniCanvasWrap');
                const canvasOverlay = $('#canvasOverlay');
                const closeCanvasBtn = $('#closeCanvasBtn');
                const randomBtn = $('[data-feat="random"]');
                const randomShieldWrap = $('#randomShieldWrap');
                const randomShieldHold = $('#randomShieldHold');

                function resetZipState() { zipImportData = null; zipJsonPath = null; isZipImport = false; }

                // 根据模式更新控件禁用状态
                function updateModeControls() {
                    const randomActive = randomBtn.classList.contains('active');
                    const globalVal = globalSel.value;

                    // 随机区域显示/隐藏
                    if (randomActive) {
                        randomShieldWrap.style.display = 'block';
                    } else {
                        randomShieldWrap.style.display = 'none';
                        randomShieldHold.checked = false;
                    }

                    // 禁用逻辑
                    if (randomActive) {
                        setControlsDisabled(true, true);   // 禁用规则列表 + 全局
                    } else {
                        if (globalVal !== '0') {
                            setControlsDisabled(true, false); // 禁用规则列表，全局不禁用
                        } else {
                            setControlsDisabled(false, false); // 全部启用
                        }
                    }
                }

                function setControlsDisabled(disableRules, disableGlobal) {
                    dynamicRules.querySelectorAll('select').forEach(s => s.disabled = disableRules);
                    addRuleBtn.disabled = disableRules;
                    globalSel.disabled = disableGlobal;
                }

                function resetAllOptions() {
                    globalSel.value = '0';
                    dynamicRules.innerHTML = '';
                    randomBtn.classList.remove('active');
                    shieldHold.checked = false;
                    randomShieldHold.checked = false;
                    updateModeControls(); // 恢复启用状态
                }

                // 事件绑定
                dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-active'); });
                dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
                dropZone.addEventListener('drop', e => {
                    e.preventDefault(); dropZone.classList.remove('drag-active');
                    const f = e.dataTransfer.files[0]; if(f) ingestFile(f);
                });
                dropZone.addEventListener('click', (e) => { if(e.target !== fileInput) fileInput.click(); });
                fileInput.addEventListener('change', e => { const f = e.target.files[0]; if(f) ingestFile(f); fileInput.value = ''; });

                function isZipFile(file) { return file.name.toLowerCase().endsWith('.zip') || file.type === 'application/zip'; }
                function isJsonFile(file) { return file.name.toLowerCase().endsWith('.json') || file.type === 'application/json'; }

                async function ingestFile(file) {
                    resetZipState();
                    if(isZipFile(file)) await handleZipFile(file);
                    else if(isJsonFile(file)) handleJsonFile(file);
                    else showToast('❌','格式错误','请上传 .json 或 .zip 文件');
                }

                function handleJsonFile(file) {
                    fileName = file.name;
                    fileChipText.textContent = file.name;
                    fileChip.classList.add('show');
                    isZipImport = false;
                    const reader = new FileReader();
                    reader.onerror = () => showToast('❌','读取失败','无法读取文件');
                    reader.onload = ev => {
                        try { loadChart(JSON.parse(ev.target.result)); }
                        catch(err) { showToast('❌','解析失败','JSON无效: '+err.message); }
                    };
                    reader.readAsText(file);
                }

                async function handleZipFile(file) {
                    fileName = file.name;
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const zip = await JSZip.loadAsync(arrayBuffer);
                        const jsonFiles = [];
                        zip.forEach((relativePath, zipEntry) => {
                            if(!zipEntry.dir && relativePath.toLowerCase().endsWith('.json')) jsonFiles.push(relativePath);
                        });
                        if(jsonFiles.length === 0) { showToast('❌','ZIP 内无 JSON','未找到谱面文件'); return; }
                        const targetPath = jsonFiles[0];
                        if(jsonFiles.length > 1) showToast('⚠️','多个 JSON 文件',`已自动选择: ${targetPath}`);
                        const jsonEntry = zip.file(targetPath);
                        if(!jsonEntry) { showToast('❌','读取失败','无法读取 ZIP 内的 JSON'); return; }
                        const chartObj = JSON.parse(await jsonEntry.async('text'));
                        zipImportData = arrayBuffer;
                        zipJsonPath = targetPath;
                        isZipImport = true;
                        fileChipText.textContent = `📦 ${file.name} → ${targetPath}`;
                        fileChip.classList.add('show');
                        loadChart(chartObj);
                    } catch(err) { showToast('❌','ZIP 处理失败',err.message); console.error(err); resetZipState(); }
                }

                function loadChart(data) {
                    if(!data || typeof data !== 'object') { showToast('❌','格式错误','JSON内容为空'); return; }
                    if(!Array.isArray(data.judgeLineList)) { showToast('❌','格式错误','缺少 judgeLineList'); return; }
                    if(data.judgeLineList.length === 0) { showToast('⚠️','空谱面','没有判定线'); return; }
                    chartData = data;
                    emptyBox.style.display = 'none';
                    workspace.classList.add('active');
                    resetAllOptions();
                    computeStats();
                    showToast('✅','加载成功',`${fileName} 已就绪`);
                }

                function getAllNotes(data) {
                    const out = [];
                    data.judgeLineList.forEach((line,li) => {
                        (line.notesAbove||[]).forEach((n,i)=>out.push({...n,_li:li,_layer:'above',_idx:i}));
                        (line.notesBelow||[]).forEach((n,i)=>out.push({...n,_li:li,_layer:'below',_idx:i}));
                    });
                    return out;
                }

                function getBpmFromChart(data) {
                    if(!data||!Array.isArray(data.judgeLineList)) return 120;
                    for(const line of data.judgeLineList) {
                        const bpm = Number(line.bpm);
                        if(!isNaN(bpm) && bpm > 0) return bpm;
                    }
                    return 120;
                }

                function computeStats() {
                    const notes = getAllNotes(chartData);
                    const c = {1:0,2:0,3:0,4:0};
                    let minBeat=Infinity, maxBeat=-Infinity;
                    notes.forEach(n => {
                        const t=Number(n.type)||0; if(c[t]!==undefined) c[t]++;
                        const beat=Number(n.time); if(!isNaN(beat)) { if(beat<minBeat) minBeat=beat; if(beat>maxBeat) maxBeat=beat; }
                    });
                    const total = notes.length;
                    statsCache = {...c, total, minBeat, maxBeat};
                    animateInt($('#sTap'),c[1]); animateInt($('#sDrag'),c[2]); animateInt($('#sFlick'),c[4]); animateInt($('#sHold'),c[3]); animateInt($('#sTotal'),total);
                    $('#pTap').textContent = pct(c[1],total); $('#pDrag').textContent = pct(c[2],total);
                    $('#pFlick').textContent = pct(c[4],total); $('#pHold').textContent = pct(c[3],total);
                    $('#dTap').style.width = pctRaw(c[1],total)+'%'; $('#dDrag').style.width = pctRaw(c[2],total)+'%';
                    $('#dFlick').style.width = pctRaw(c[4],total)+'%'; $('#dHold').style.width = pctRaw(c[3],total)+'%';
                    requestAnimationFrame(()=>drawTimeline(notes));
                }

                function pct(v,t){ return t?((v/t)*100).toFixed(1)+'%':'0%'; }
                function pctRaw(v,t){ return t?(v/t)*100:0; }
                function animateInt(el,target) {
                    const start=performance.now(), from=parseInt(el.textContent.replace(/\D/g,''))||0, dur=700;
                    (function tick(now){ const p=Math.min((now-start)/dur,1), ease=1-Math.pow(1-p,3); el.textContent=Math.round(from+(target-from)*ease); if(p<1) requestAnimationFrame(tick); })(start);
                }

                function drawTimeline(notes, canvasId = 'timeCanvas') {
                    const canvas = $('#' + canvasId);
                    const wrap = canvas.parentElement;
                    const dpr = window.devicePixelRatio || 1;
                    const W = canvasId === 'largeTimeCanvas' ? wrap.clientWidth * 0.95 : wrap.clientWidth;
                    const H = canvasId === 'largeTimeCanvas' ? wrap.clientHeight * 0.8 : wrap.clientHeight;
                    if (!W || !H) return;
                    canvas.width = W * dpr;
                    canvas.height = H * dpr;
                    const ctx = canvas.getContext('2d');
                    ctx.scale(dpr, dpr);
                    ctx.clearRect(0, 0, W, H);
                    if (!notes.length) return;
                    const beats = notes.map(n => Number(n.time) || 0);
                    const minB = Math.min(...beats);
                    const maxB = Math.max(...beats);
                    const range = maxB - minB || 1;
                    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                    ctx.lineWidth = 1;
                    for (let i = 1; i < 4; i++) {
                        const y = (H / 4) * i;
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(W, y);
                        ctx.stroke();
                    }
                    notes.forEach(n => {
                        const x = ((Number(n.time) - minB) / range) * (W - 4) + 2;
                        const px = Number(n.positionX) || 0;
                        const y = H / 2 + px * (H * 0.35 / 6);
                        const color = { 1: '#60c8ff', 2: '#ffe066', 3: '#5eead4', 4: '#ff6b6b' }[n.type] || '#fff';
                        ctx.fillStyle = color;
                        ctx.globalAlpha = 0.55;
                        const size = n.type === 3 ? 3 : 2.2;
                        ctx.fillRect(x - size / 2, Math.max(2, Math.min(H - 4, y - size / 2)), size, size);
                    });
                    ctx.globalAlpha = 1;
                }

                function createRuleRow(fromVal = 1, toVal = 2) {
                    const row = document.createElement('div');
                    row.className = 'rule-row';
                    const fromSelect = document.createElement('select');
                    const toSelect = document.createElement('select');
                    typeOptions.forEach(opt => {
                        fromSelect.add(new Option(opt.label, opt.value));
                        toSelect.add(new Option(opt.label, opt.value));
                    });
                    fromSelect.value = fromVal;
                    toSelect.value = toVal;
                    const updateDisabled = () => {
                        const fVal = parseInt(fromSelect.value);
                        const tVal = parseInt(toSelect.value);
                        Array.from(toSelect.options).forEach(opt => opt.disabled = (parseInt(opt.value) === fVal));
                        Array.from(fromSelect.options).forEach(opt => opt.disabled = (parseInt(opt.value) === tVal));
                        if (fVal === tVal) toSelect.value = Array.from(toSelect.options).find(o => !o.disabled)?.value || fVal;
                    };
                    fromSelect.addEventListener('change', updateDisabled);
                    toSelect.addEventListener('change', updateDisabled);
                    updateDisabled();
                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-btn';
                    delBtn.textContent = '×';
                    delBtn.addEventListener('click', () => row.remove());
                    const arrow = document.createElement('span');
                    arrow.className = 'arrow';
                    arrow.textContent = '→';
                    row.appendChild(fromSelect);
                    row.appendChild(arrow);
                    row.appendChild(toSelect);
                    row.appendChild(delBtn);

                    // 新行根据当前模式设置禁用状态
                    const randomActive = randomBtn.classList.contains('active');
                    const globalVal = globalSel.value;
                    const disableRules = randomActive || (globalVal !== '0');
                    fromSelect.disabled = disableRules;
                    toSelect.disabled = disableRules;

                    return row;
                }

                addRuleBtn.addEventListener('click', () => {
                    dynamicRules.appendChild(createRuleRow());
                });

                function getRulesFromUI() {
                    const global = parseInt(globalSel.value) || 0;
                    const map = {};
                    if (global === 0) {
                        dynamicRules.querySelectorAll('.rule-row').forEach(row => {
                            const selects = row.querySelectorAll('select');
                            if (selects.length >= 2) {
                                const from = parseInt(selects[0].value);
                                const to = parseInt(selects[1].value);
                                if (!isNaN(from) && !isNaN(to)) map[from] = to;
                            }
                        });
                    }
                    return { global, map };
                }

                // 随机按钮点击
                randomBtn.addEventListener('click', () => {
                    randomBtn.classList.toggle('active');
                    updateModeControls();
                });

                // 全局统一下拉变化
                globalSel.addEventListener('change', updateModeControls);

                function getFeatures() {
                    return { random: randomBtn.classList.contains('active') };
                }

                function processChartData(data, rules, shield, feats) {
                    const newData = JSON.parse(JSON.stringify(data));
                    const lines = newData.judgeLineList;

                    if (feats.random) {
                        const types = [1, 2, 3, 4];
                        for (let li = 0; li < lines.length; li++) {
                            const line = lines[li];
                            ['notesAbove', 'notesBelow'].forEach(layer => {
                                if (!line[layer]) return;
                                line[layer] = line[layer].map(note => {
                                    const noteCopy = { ...note };
                                    const type = Number(noteCopy.type) || 0;
                                    if (!(shield && type === 3)) {
                                        noteCopy.type = types[Math.floor(Math.random() * types.length)];
                                    }
                                    return noteCopy;
                                });
                            });
                        }
                        return newData;
                    }

                    const { global, map } = rules;
                    for (let li = 0; li < lines.length; li++) {
                        const line = lines[li];
                        ['notesAbove', 'notesBelow'].forEach(layer => {
                            if (!line[layer]) return;
                            const kept = [];
                            for (let i = 0; i < line[layer].length; i++) {
                                const note = { ...line[layer][i] };
                                const type = Number(note.type) || 0;
                                if (shield && type === 3) { kept.push(note); continue; }
                                if (global > 0) note.type = global;
                                else if (map[type] !== undefined) note.type = map[type];
                                kept.push(note);
                            }
                            line[layer] = kept;
                        });
                    }
                    return newData;
                }

                function generateDownloadName(baseName, feats, rules) {
                    const base = baseName.replace(/\.(json|zip)$/i, '');
                    const tags = [];
                    if (feats.random) {
                        tags.push('random');
                    } else {
                        const { global, map } = rules;
                        if (global > 0) tags.push('all' + (typeNames[global] || global));
                        else if (Object.keys(map).length) tags.push('mod');
                    }
                    return base + (tags.length ? '_' + tags.join('_') : '_processed');
                }

                function applyDifficultyToInfo(infoContent, rules, feats) {
                    if (feats.random) {
                        return infoContent.replace(/^(Level:\s*)\S+(\s*.*)$/m, '$1RANDOM$2');
                    }
                    const { global, map } = rules;
                    let newDiff = null;
                    if (global > 0) {
                        const diffMap = { 1: 'AT', 2: 'AD', 3: 'AH', 4: 'AF' };
                        newDiff = diffMap[global] || null;
                    } else if (Object.keys(map).length > 0) {
                        newDiff = '?';
                    }
                    if (!newDiff) return infoContent;
                    return infoContent.replace(/^(Level:\s*)\S+(\s*.*)$/m, `$1${newDiff}$2`);
                }

                processBtn.addEventListener('click', async () => {
                    try {
                        if (!chartData) { showToast('❌', '未加载', '请先上传谱面'); return; }
                        const rules = getRulesFromUI();
                        const feats = getFeatures();
                        const shield = feats.random ? randomShieldHold.checked : shieldHold.checked;
                        processBtn.disabled = true;
                        showOverlay(true);
                        setProgress(30, '处理中…', '正在应用修改');
                        const processedData = processChartData(chartData, rules, shield, feats);
                        const jsonStr = JSON.stringify(processedData);
                        setProgress(70, '生成文件…', isZipImport ? '重新打包 ZIP' : '生成 JSON');
                        if (isZipImport && zipImportData && zipJsonPath) {
                            const zip = await JSZip.loadAsync(zipImportData);
                            let infoFile = zip.file('info.txt') || zip.file('Info.txt') || zip.file('INFO.TXT');
                            if (!infoFile) {
                                zip.forEach((path, entry) => {
                                    if (!entry.dir && path.toLowerCase() === 'info.txt') infoFile = entry;
                                });
                            }
                            if (infoFile) {
                                const infoContent = await infoFile.async('text');
                                const newInfo = applyDifficultyToInfo(infoContent, rules, feats);
                                zip.file(infoFile.name, newInfo);
                                showToast('🔧', '难度已更新', `info.txt 难度缩写已自动修改`);
                            }
                            zip.file(zipJsonPath, jsonStr);
                            const newZipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
                            const url = URL.createObjectURL(newZipBlob);
                            const a = document.createElement('a'); a.href = url;
                            a.download = generateDownloadName(fileName, feats, rules) + '.zip';
                            document.body.appendChild(a); a.click(); document.body.removeChild(a);
                            setTimeout(() => URL.revokeObjectURL(url), 200);
                            setProgress(100, '完成', 'ZIP 文件已下载');
                            showToast('✅', '处理完成', a.download);
                        } else {
                            const blob = new Blob([jsonStr], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a'); a.href = url;
                            a.download = generateDownloadName(fileName, feats, rules) + '.json';
                            document.body.appendChild(a); a.click(); document.body.removeChild(a);
                            setTimeout(() => URL.revokeObjectURL(url), 200);
                            setProgress(100, '完成', 'JSON 文件已下载');
                            showToast('✅', '处理完成', a.download);
                        }
                    } catch (err) { showToast('❌', '处理失败', err.message); console.error(err); }
                    finally { setTimeout(() => { showOverlay(false); processBtn.disabled = false; }, 800); }
                });

                resetBtn.addEventListener('click', resetAllOptions);
                reportBtn.addEventListener('click', () => {
                    if (!chartData || !statsCache) { showToast('❌', '无数据', '请先加载谱面'); return; }
                    const s = statsCache;
                    const lines = [
                        '╔══════════════════════════════════════════╗',
                        '║      Phigros Chart Analysis Report       ║',
                        '╠══════════════════════════════════════════╣',
                        `  File: ${fileName}`,
                        `  Format: ${chartData.formatVersion ?? 'Unknown'}`,
                        `  BPM: ${getBpmFromChart(chartData)}`,
                        `  JudgeLines: ${chartData.judgeLineList.length}`,
                        `  Beat Range: ${s.minBeat.toFixed(1)} ~ ${s.maxBeat.toFixed(1)}`,
                        '╠══════════════════════════════════════════╣',
                        '  Note Statistics',
                        `    Tap   : ${s[1]} (${pct(s[1], s.total)})`,
                        `    Drag  : ${s[2]} (${pct(s[2], s.total)})`,
                        `    Flick : ${s[4]} (${pct(s[4], s.total)})`,
                        `    Hold  : ${s[3]} (${pct(s[3], s.total)})`,
                        `    ────────`,
                        `    Total : ${s.total}`,
                        '╚══════════════════════════════════════════╝'
                    ].join('\n');
                    const blob = new Blob([lines], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = fileName.replace(/\.(json|zip)$/i, '_report.txt');
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 200);
                    showToast('📄', '报告已导出', '统计报告已下载');
                });

                miniCanvasWrap.addEventListener('click', () => {
                    if (!chartData) return;
                    canvasOverlay.classList.add('on');
                    requestAnimationFrame(() => drawTimeline(getAllNotes(chartData), 'largeTimeCanvas'));
                });
                closeCanvasBtn.addEventListener('click', () => canvasOverlay.classList.remove('on'));
                canvasOverlay.addEventListener('click', (e) => {
                    if (e.target === canvasOverlay) canvasOverlay.classList.remove('on');
                });

                function showOverlay(on) { overlay.classList.toggle('on', on); }
                function setProgress(pctVal, status, detail) {
                    progPct.textContent = pctVal + '%'; progStatus.textContent = status;
                    progBar.style.width = pctVal + '%'; progDetail.textContent = detail;
                }
                let toastTimer;
                function showToast(icon, title, msg) {
                    $('#toastIcon').textContent = icon; $('#toastTitle').textContent = title; $('#toastMsg').textContent = msg;
                    toast.classList.add('on'); clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => toast.classList.remove('on'), 3500);
                }
                window.addEventListener('resize', () => {
                    if (chartData && statsCache) requestAnimationFrame(() => drawTimeline(getAllNotes(chartData)));
                });
            })();
        })();

        document.getElementById('back-btn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            location.href = './index.html';
        });
        document.getElementById('reload-btn').addEventListener('click', () => {
            location.reload();
        });
    </script>
